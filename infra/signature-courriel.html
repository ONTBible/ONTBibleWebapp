     ## La tuile est à côté du texte, et ça se paie

     Le filet d'or sépare la marque du texte, comme dans le combination mark.
     C'est un tableau à trois cellules — et l'éditeur de signatures de Mail
     **aplatit les tableaux** : collé là, le logo remonte au-dessus du texte.

     ## Le chemin qui marche

     Mail garde ses signatures dans
     `~/Library/Mail/V*/MailData/Signatures/*.mailsignature`. Chaque fichier est
     un message : quelques en-têtes, une ligne vide, puis le HTML.

     1. Créer une signature quelconque dans Mail, puis **quitter Mail** ;
     2. ouvrir le `.mailsignature` le plus récent (Finder y donne accès sans
        rien débloquer — un terminal, non : macOS répond « Operation not
        permitted ») ;
     3. remplacer **tout** le fichier par les quatre en-têtes, une ligne vide,
        puis ce corps. **Conserver le `Message-Id` d'origine** : c'est lui qui
        relie le fichier à la signature dans les réglages ;
     4. verrouiller le fichier (Lire les informations → Verrouillé), sinon Mail
        le réécrit à la première ouverture ;
     5. rouvrir Mail.

     Le prix : la signature ne s'édite plus depuis les réglages. Le dessin exact
     contre l'édition dans l'interface.

     Mail incorpore la tuile au message à l'envoi — inutile de la mettre en
     pièce jointe soi-même, comme il l'avait fait tout seul au premier essai.

     ## Pourquoi des styles en ligne, et un PNG

     Le HTML des courriels est resté en 2005 : ni grille, ni feuille externe.
     Des `style=` sur chaque balise, c'est le seul dialecte que Gmail, Outlook
     et Mail parlent tous. Et Gmail comme Outlook **suppriment les SVG** : la
     tuile est donc `touch-icon.png`, servie depuis `ontbible.com/images/`.
     Elle est **opaque**, donc elle tient sur un fond clair comme sur un sombre
     — la raison même pour laquelle ce fichier existe (§6).

     ## Pourquoi aucune requête de thème

     Le premier essai portait un `@media (prefers-color-scheme: dark)`. Dans un
     client en mode sombre qui garde le fond clair du message, il donnait du
     **crème sur du blanc**. La signature porte donc un fond blanc explicite, et
     Mail se charge très bien de l'adapter en mode sombre : fond aubergine,
     encre crème, l'or qui ressort.

     ## La pile de polices

     Jost n'est installée chez personne. Avenir Next prend le relais chez Apple,
     Helvetica ailleurs — géométriques toutes deux. Le corps retombe sur
     Georgia, faute de Literata.

     ## Sur iPhone

     Les signatures d'iOS sont en **texte brut** : ni image, ni couleur, ni
     filet. Y mettre :

         Gloire Bikouta
         Auteur de la restitution
         contact@ontbible.com — ontbible.com -->
