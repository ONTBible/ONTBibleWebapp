<!-- Signature de courriel — contact@ontbible.com

     ## Pourquoi des tableaux et des styles en ligne

     Le HTML des courriels est resté en 2005 : ni grille, ni flexbox, ni
     feuille externe. Un tableau et des `style=` sur chaque balise, c'est le
     seul dialecte que Gmail, Outlook et Mail parlent tous.

     ## Pourquoi un PNG et pas le vecteur

     Gmail et Outlook **suppriment** les SVG. La tuile est donc
     `touch-icon.png`, servie depuis `ontbible.com/images/` — notre domaine,
     déjà déployé, déjà en cache. Et elle est **opaque** : elle porte son fond
     d'aubergine, donc elle tient sur un fond clair comme sur un fond sombre,
     exactement la raison pour laquelle ce fichier existe (§6).

     ## Pourquoi un fond blanc explicite, et aucune requête de thème

     Le premier essai portait un `@media (prefers-color-scheme: dark)`. Rendu
     dans un client en mode sombre qui garde le fond clair du message, il
     donnait du **crème sur du blanc** — illisible, et invisible à l'auteur qui
     compose en sombre. Une signature ne doit dépendre de rien : elle porte donc
     son propre fond, et se lit partout de la même façon.

     ## La pile de polices

     Jost n'est installée chez personne. Avenir Next prend le relais chez Apple,
     Helvetica ailleurs — géométriques toutes deux, donc l'esprit tient. Le
     corps retombe sur Georgia, faute de Literata.

     ## L'installer dans Mail

     **Ne pas la coller dans l'éditeur de signatures** : il aplatit les
     tableaux, et le logo se retrouve au-dessus du texte au lieu d'être à côté.
     Il faut écrire le HTML directement dans le `.mailsignature` de
     `~/Library/Mail/V*/MailData/Signatures/`, Mail quitté, puis verrouiller le
     fichier pour qu'il ne le réécrive pas.

     Sur iPhone, les signatures sont en texte brut : ni image, ni tableau.
     Prévoir une version texte à part. -->

<table cellpadding="0" cellspacing="0" border="0" role="presentation" bgcolor="#ffffff"
       style="border-collapse:collapse;background-color:#ffffff;
              font-family:Georgia,'Times New Roman',serif;">
  <tr>
    <td style="padding:2px 18px 2px 0;vertical-align:middle;background-color:#ffffff;">
      <img src="https://ontbible.com/images/touch-icon.png"
           width="56" height="56" alt="La Bible ONT"
           style="display:block;width:56px;height:56px;border:0;border-radius:13px;" />
    </td>

    <!-- Le filet qui sépare, comme dans le combination mark. -->
    <td width="1" bgcolor="#CDBE83"
        style="width:1px;background-color:#CDBE83;font-size:0;line-height:0;">&nbsp;</td>

    <td style="padding:2px 0 2px 18px;vertical-align:middle;background-color:#ffffff;">
      <div style="font-family:Jost,'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif;
                  font-size:17px;line-height:1.3;color:#421B26;letter-spacing:.01em;">
        Gloire Bikouta
      </div>

      <div style="margin-top:3px;font-family:Jost,'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif;
                  font-size:11px;line-height:1.4;color:#6F6660;
                  text-transform:uppercase;letter-spacing:.16em;">
        Auteur de la restitution
      </div>

      <div style="margin-top:10px;font-size:13px;line-height:1.6;">
        <a href="mailto:contact@ontbible.com"
           style="color:#421B26;text-decoration:none;">contact@ontbible.com</a><br />
        <a href="https://ontbible.com"
           style="color:#8A6A3B;text-decoration:none;">ontbible.com</a>
      </div>
    </td>
  </tr>
</table>
