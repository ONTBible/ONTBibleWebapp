     ## Elle est empilée, et ce n'est pas un choix esthétique

     Le premier dessin mettait la tuile **à côté** du texte, séparée par le
     filet d'or — le patron du combination mark. Il ne survit pas.

     L'éditeur de signatures de Mail convertit ce qu'on lui colle en texte
     enrichi : il garde les images, les couleurs, les liens et les sauts de
     ligne, et il **aplatit les tableaux**. Le logo se retrouvait au-dessus du
     texte, dans un désordre qu'on n'avait pas dessiné.

     Deux issues, et une seule est raisonnable. Écrire le HTML directement dans
     le `.mailsignature` de `~/Library/Mail/V*/MailData/Signatures/` préserve
     tout — mais macOS protège ce dossier, il faut accorder l'accès disque
     complet au terminal, quitter Mail, puis verrouiller le fichier pour qu'il
     ne le réécrive pas. Baisser une barrière de sécurité du système pour une
     signature n'en vaut pas le prix.

     On dessine donc ce qui passe : une colonne. Le filet d'or y sépare
     l'identité des adresses, comme il sépare un titre de section de son texte
     sur le site.

     ## Pourquoi des styles en ligne

     Le HTML des courriels est resté en 2005 : ni grille, ni flexbox, ni
     feuille externe. Des `style=` sur chaque balise, c'est le seul dialecte que
     Gmail, Outlook et Mail parlent tous.

     ## Pourquoi un PNG et pas le vecteur

     Gmail et Outlook **suppriment** les SVG. La tuile est donc
     `touch-icon.png`, servie depuis `ontbible.com/images/` — notre domaine,
     déjà déployé, déjà en cache. Et elle est **opaque** : elle porte son fond
     d'aubergine, donc elle tient sur un fond clair comme sur un fond sombre.
     C'est la raison même pour laquelle ce fichier existe (§6).

     ## Pourquoi un fond blanc explicite, et aucune requête de thème

     Le premier essai portait un `@media (prefers-color-scheme: dark)`. Rendu
     dans un client en mode sombre qui garde le fond clair du message, il
     donnait du **crème sur du blanc** — illisible, et invisible à l'auteur qui
     compose en sombre. Une signature ne doit dépendre de rien.

     ## La pile de polices

     Jost n'est installée chez personne. Avenir Next prend le relais chez Apple,
     Helvetica ailleurs — géométriques toutes deux, donc l'esprit tient. Le
     corps retombe sur Georgia, faute de Literata.

     ## Sur iPhone

     Les signatures d'iOS sont en **texte brut** : ni image, ni couleur, ni
     filet. Y mettre la version texte :

         Gloire Bikouta
         Auteur de la restitution
         contact@ontbible.com — ontbible.com -->
