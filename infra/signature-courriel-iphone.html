<!-- Signature de courriel — la variante iPhone

     ## Pourquoi il en faut deux

     Le dessin du Mac met la tuile **à côté** du texte. Sur un écran de
     téléphone, la colonne de texte s'y trouve écrasée : `contact@ontbible.com`
     se coupait en « contact@ontbible.co / m ». On empile donc, et le texte
     retrouve toute la largeur.

     Ce n'est pas un compromis, c'est chaque appareil à sa mesure.

     ## Le circuit, et il n'a pas de raccourci

     iOS n'a pas d'éditeur de signature riche : le champ des Réglages ne fait
     que **conserver** ce qu'on y colle. Et l'image ne voyage que si elle est
     une vraie pièce jointe dans ce qu'on copie :

         Mac → écrire le .mailsignature → s'envoyer un message avec cette
         signature → l'ouvrir sur l'iPhone → attendre que la tuile s'affiche →
         copier là → Réglages, Mail, Signature, coller.

     Copié depuis Safari, ou depuis le **corps** d'un message où l'on a collé le
     HTML à la main, le logo n'est qu'un lien vers `ontbible.com`. iOS ne le
     suit pas : on récupère un « ? » bleu. C'est l'erreur qui a coûté deux
     essais.

     ## Ce qu'iOS jette, et ce qu'il garde

     Éprouvé, pas supposé :

     | ce qu'on écrit | ce qu'il en reste |
     |---|---|
     | tableau, cellules, colonnes | **gardé** |
     | image en pièce jointe | **gardée**, avec son `border-radius` |
     | `text-transform`, `letter-spacing` | **gardés** |
     | bordure de cellule | **gardée** — c'est le filet |
     | `font-size` | **jeté** — tout passe au corps du composeur |
     | couleur des liens | **jetée** — iOS impose son bleu |
     | `background-color` sur un `div` | **jeté** — d'où le filet disparu |

     Le filet est donc une **bordure** (`border-bottom`) et non un bloc coloré.
     Et le fond blanc vit sur un `<table>`, qui se rétracte au contenu : sur un
     `<div>`, il partait sur toute la largeur du message.

     ## Ce qu'on ne récupérera pas

     La hiérarchie des tailles — le nom et la fonction sortent au même corps — et
     l'or des liens. Ce sont des décisions d'iOS, pas des défauts d'ici. Le
     nom, la fonction, le filet, la tuile et les deux adresses passent : c'est
     une vraie signature, et c'est ce qu'on cherchait.

     ## Le reste

     Voir `signature-courriel.html` pour le dessin du Mac, et pour ce qui vaut
     des deux côtés : les styles en ligne, le PNG plutôt que le SVG, le fond
     blanc explicite, et l'écriture directe dans le `.mailsignature`. -->
