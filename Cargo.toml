[package]
name = "ontbible"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
# `serde` traverse la frontière client ↔ serveur : il est des deux côtés.
serde = { version = "1", features = ["derive"] }
axum = { version = "0.8", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
leptos_axum = { version = "0.8", optional = true }
# L'adaptateur du runtime Lambda. Le **même** binaire sert des deux côtés :
# `lambda_http` prend la main quand `AWS_LAMBDA_FUNCTION_NAME` est là, sinon on
# ouvre un port. Même version que le backend de l'app, qui tourne déjà ainsi.
lambda_http = { version = "0.13", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
wasm-bindgen = { version = "0.2.106", optional = true }
# Le stockage local pour les réglages de lecture, et de quoi mesurer le temps
# et la page pour la traversée du seuil. Leptos réexporte `web_sys`, mais
# chaque interface du navigateur est derrière son propre drapeau, et seules
# celles qu'on demande entrent dans le binaire wasm.
web-sys = { version = "0.3", features = [
    "Storage",
    # `getBoundingClientRect` — la hauteur de la scène du seuil.
    "DomRect",
    # L'horloge du navigateur. Une animation comptée en images serait deux
    # fois plus rapide sur une dalle à 120 Hz que sur une à 60.
    "Performance",
    # Défiler **sans** repasser par le `scroll-behavior` de la feuille. Sans
    # elles, `window.scrollTo(x, y)` hérite du `smooth` posé sur `html` : la
    # traversée du seuil relançait alors un défilement doux du navigateur à
    # chaque image, et les deux se disputaient la page.
    "ScrollToOptions",
    "ScrollBehavior",
], optional = true }
# Lire un fichier et lire l'heure sont deux besoins du serveur seul. Les
# embarquer dans le paquet WASM l'alourdirait sans que rien ne s'en serve —
# la table des fuseaux horaires pèse à elle seule plus que tout le reste.
serde_json = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
], optional = true }
chrono-tz = { version = "0.10", default-features = false, optional = true }
# Le contrat des données ONT, pris à sa source.
#
# Le site décrivait lui-même la forme du JSON du pipeline — 450 lignes de DTO,
# une troisième description du même schéma après le TypeScript et le Swift. Et
# quand trois descriptions divergent, le défaut est **muet** : un type de nœud
# inconnu était simplement omis, la page s'affichait, il manquait un mot. C'est
# arrivé, sur quatre types qui ne vivent que dans les définitions du lexique.
#
# Il en reste deux — celle-ci et le Swift.
#
# `default-features = false` : seul `schema` entre. Les analyseurs du pipeline
# ajouteraient `regex` et ses tables Unicode à un binaire Lambda qui ne parse
# aucun markdown.
#
# Par chemin, et non par version : les deux dépôts sont côte à côte, en local
# comme dans la CI, où `deployer.yml` les clone déjà tous les trois. C'est le
# même voisinage que celui dont `include_str!` dépend depuis le premier jour.
#
# `package` parce que la caisse s'appelle `ont-pipeline` et sa bibliothèque
# `ont` : la clé d'une dépendance est le nom du **paquet**, pas celui de la
# cible.
ont = { package = "ont-pipeline", path = "../ONTBibleApp/pipeline", default-features = false, optional = true }

[features]
hydrate = [
  "leptos/hydrate",
  "dep:console_error_panic_hook",
  "dep:wasm-bindgen",
  # Les réglages de lecture sont retenus en JSON dans le stockage local.
  "dep:serde_json",
  "dep:web-sys",
]
ssr = [
    "dep:ont",
    "dep:axum",
    "dep:lambda_http",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:serde_json",
    "dep:chrono",
    "dep:chrono-tz",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

# Le paquet WASM part sur le réseau à chaque visite : on l'optimise pour la
# taille, pas pour la vitesse d'exécution. Un site vitrine ne calcule rien.
# Le corpus embarqué dépasse ce qu'un objet Mach-O sait porter.
#
# Le site embarque tout `dist/` par `include_str!` (§8 bis) — près de deux
# mégaoctets de données statiques dans un seul crate. Au-delà d'un seuil, la
# génération de code rend « cannot encode offset of relocations; object file
# too large », et le linker d'Apple **plante** dans
# `ld::FixupFromRelocs::arm64_b26`.
#
# Deux réglages sont nécessaires, et aucun ne suffit seul : `debug = 0` retire
# les métadonnées DWARF qui doublent la taille de l'objet, `codegen-units = 256`
# disperse les constantes — et `scripts/linker-local.sh` remplace le linker
# d'Apple par celui de LLVM.
#
# On perd le débogueur pas à pas en local. Ni la CI (Ubuntu) ni le déploiement
# (`cargo lambda` et zig) n'empruntent ce chemin.
[profile.dev]
debug = 0
codegen-units = 256

[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
output-name = "ontbible"
site-root = "target/site"
site-pkg-dir = "pkg"
# Le nom des fichiers porte l'empreinte de leur contenu.
#
# Sans ça, `ontbible.js` et `ontbible.wasm` sont servis sans `cache-control` —
# seulement un `last-modified`. Un navigateur applique alors son cache
# heuristique et ne revalide pas : un visiteur qui revient exécute l'ancien
# WASM contre le nouveau HTML. Le rendu du serveur reste juste, donc la page
# s'affiche — mais tout ce qui vient de l'hydratation manque, en silence.
#
# C'est arrivé en développement, sur le panneau de lecture. Derrière un CDN,
# ça durerait des jours. Avec l'empreinte, un contenu nouveau a un nom nouveau :
# il ne peut pas être servi depuis le cache.
hash-files = true
# `hash-file` n'existe pas — cargo-leptos l'ignore et le dit dans son journal :
# « Metadata keys ["hash-file"] … are not recognized ». La vraie clé s'appelle
# `hash-file-name`, mais elle ne réglerait rien : le chemin qu'elle prend est
# relatif au dossier du binaire serveur, `target/<profil>/`. Le manifeste y est
# donc écrit dans tous les cas, et c'est au déploiement de le porter là où le
# serveur le cherche.
# Tailwind remplace la feuille Sass. `cargo-leptos` télécharge le binaire
# officiel et le lance à chaque compilation.
tailwind-input-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
